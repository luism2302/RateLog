# Development only: Postgres reachable from your machine on localhost:5433 (for make live).
#   docker compose -f compose.dev.yaml up -d db
name: ratelog-dev

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      RATELOG_OWNER_PASSWORD: ${RATELOG_OWNER_PASSWORD}
      RATELOG_APP_PASSWORD: ${RATELOG_APP_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
    # Fixed name to keep using the existing development volume
    name: ratelog_pgdata
