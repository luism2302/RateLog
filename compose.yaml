# RateLog: Postgres + migrations + app.
#   cp .env.example .env   (and fill it in)
#   docker compose up -d
# The app runs at http://localhost:8000 (or on the RATELOG_PORT port).
name: ratelog

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-ratelog: &ratelog
  <<: *logging
  image: ${RATELOG_IMAGE:-luism2302/ratelog:v0.1.0}
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  db:
    <<: *logging
    # Pinned by digest; to update: docker buildx imagetools inspect postgres:<version>
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is missing from .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is missing from .env}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is missing from .env}
      RATELOG_OWNER_PASSWORD: ${RATELOG_OWNER_PASSWORD:?RATELOG_OWNER_PASSWORD is missing from .env}
      RATELOG_APP_PASSWORD: ${RATELOG_APP_PASSWORD:?RATELOG_APP_PASSWORD is missing from .env}
    volumes:
      - postgres:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 200
    networks: [backend]
    restart: unless-stopped

  # Applies the migrations as the schema owner, then exits
  migrate:
    <<: *ratelog
    command: ["-migrate"]
    environment:
      RATELOG_MIGRATE_DSN: postgres://ratelog_owner:${RATELOG_OWNER_PASSWORD}@db:5432/${DB_NAME}
    healthcheck:
      disable: true
    networks: [backend]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  # The server, using a role that can't change the schema
  app:
    <<: *ratelog
    environment:
      RATELOG_DB_DSN: postgres://ratelog_app:${RATELOG_APP_PASSWORD}@db:5432/${DB_NAME}
      RAWG_API_KEY: ${RAWG_API_KEY:?RAWG_API_KEY is missing from .env}
    # 127.0.0.1 only: to expose it beyond this machine, put an HTTPS proxy in front
    ports:
      - "127.0.0.1:${RATELOG_PORT:-8000}:8000"
    mem_limit: 256m
    pids_limit: 100
    networks: [backend, frontend]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  # No internet access: only db, migrate and app can reach each other
  backend:
    internal: true
  # For the published port and the RAWG API calls
  frontend:

volumes:
  postgres:
